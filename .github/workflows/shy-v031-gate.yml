name: SHY v0.31 Temporal Gate
on:
  push:
    branches: [codex/shy-v0.31-temporal-intelligence]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_DB: shy, POSTGRES_USER: shy, POSTGRES_PASSWORD: shy_local_dev}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shy -d shy"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://shy:shy_local_dev@127.0.0.1:5432/shy
      SHY_LOCAL_MODEL: qwen3.5:4b
      OLLAMA_URL: http://127.0.0.1:11434
      SHY_API_BASE_URL: http://127.0.0.1:8031
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install -r services/core/requirements.txt
      - run: python -m py_compile services/core/main.py services/agent-runtime/temporal_intelligence.py services/agent-runtime/platform_manifest.py tests/test_temporal_intelligence_v031.py tests/test_temporal_intelligence_live_v031.py
      - run: python tests/test_temporal_intelligence_v031.py
      - name: Protected regressions
        run: |
          python tests/test_goal_orchestration_v025.py
          python tests/test_multimodal_v024.py
          python tests/test_vision_intelligence_v023.py
          python tests/test_voice_computer_v022.py
          python tests/test_learning_decision_v021.py
          python tests/test_multistep_agent.py
          python tests/test_multi_model_brain.py
          python tests/test_health_integrity_v019.py
      - name: Fake Ollama
        shell: bash
        run: |
          cat >/tmp/o.py <<'PY'
          import json
          from http.server import BaseHTTPRequestHandler,HTTPServer
          class H(BaseHTTPRequestHandler):
            def s(self,p):
              b=json.dumps(p).encode(); self.send_response(200); self.send_header("Content-Type","application/json"); self.send_header("Content-Length",str(len(b))); self.end_headers(); self.wfile.write(b)
            def do_GET(self):
              if self.path=="/api/tags": return self.s({"models":[{"name":"qwen3.5:4b","model":"qwen3.5:4b"}]})
              self.send_response(404); self.end_headers()
            def do_POST(self):
              n=int(self.headers.get("Content-Length","0") or "0")
              if n:self.rfile.read(n)
              if self.path=="/api/chat": return self.s({"message":{"role":"assistant","content":"controlled"}})
              self.send_response(404); self.end_headers()
            def log_message(self,*a): pass
          HTTPServer(("127.0.0.1",11434),H).serve_forever()
          PY
          nohup python /tmp/o.py >/tmp/o.log 2>&1 &
      - name: Start SHY
        shell: bash
        run: |
          cd services/core
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8031 >/tmp/shy.log 2>&1 &
          cd ../..
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8031/health >/tmp/h.json; then exit 0; fi
            sleep .5
          done
          cat /tmp/shy.log; exit 1
      - run: python tests/test_temporal_intelligence_live_v031.py
      - run: git diff --check
      - if: failure()
        run: cat /tmp/shy.log || true
