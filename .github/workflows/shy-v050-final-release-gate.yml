name: SHY v0.50 Final Release Gate

on:
  push:
    branches:
      - codex/shy-v0.50-integrated-platform
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shy
          POSTGRES_USER: shy
          POSTGRES_PASSWORD: shy_local_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shy -d shy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://shy:shy_local_dev@127.0.0.1:5432/shy
      SHY_LOCAL_MODEL: qwen3.5:4b
      OLLAMA_URL: http://127.0.0.1:11434
      SHY_API_BASE_URL: http://127.0.0.1:8050

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install core dependencies
        run: python -m pip install -r services/core/requirements.txt

      - name: Compile full SHY runtime
        run: python -m compileall -q services/core services/agent-runtime services/model-router tests

      - name: Run continuous milestone sequence
        shell: bash
        run: |
          set -e
          python tests/test_business_agent_v017.py
          python tests/test_cognitive_intelligence_v018.py
          python tests/test_universal_knowledge_v019.py
          python tests/test_expert_intelligence_v020.py
          python tests/test_decision_intelligence_v021.py
          python tests/test_learning_decision_v021.py
          python tests/test_voice_computer_v022.py
          python tests/test_vision_intelligence_v023.py
          python tests/test_multimodal_v024.py
          python tests/test_goal_orchestration_v025.py
          python tests/test_preference_context_v026.py
          python tests/test_entity_graph_v027.py
          python tests/test_reliability_v028.py
          python tests/test_tool_registry_v029.py
          python tests/test_platform_manifest_v030.py
          python tests/test_temporal_intelligence_v031.py
          python tests/test_condition_intelligence_v032.py
          python tests/test_collaboration_intelligence_v033.py
          python tests/test_recovery_rollback_v034.py
          python tests/test_document_intelligence_v035.py
          python tests/test_data_workspace_v036.py
          python tests/test_code_repository_v037.py
          python tests/test_research_orchestration_v038.py
          python tests/test_business_operations_v039.py
          python tests/test_financial_planning_v040.py
          python tests/test_compliance_policy_v041.py
          python tests/test_incident_triage_v042.py
          python tests/test_resource_capacity_v043.py
          python tests/test_change_impact_v044.py
          python tests/test_experiment_causal_v045.py
          python tests/test_forecast_trend_v046.py
          python tests/test_approval_governance_v047.py
          python tests/test_resilience_fallback_v048.py
          python tests/test_release_readiness_v049.py
          python tests/test_integrated_platform_v050.py
          python tests/test_platform_sequence_current.py

      - name: Run protected core regressions
        shell: bash
        run: |
          set -e
          python tests/test_multistep_agent.py
          python tests/test_multi_model_brain.py
          python tests/test_tool_intelligence.py
          python tests/test_advanced_memory.py
          python tests/test_memory_relevance.py
          python tests/test_research_synthesis.py
          python tests/test_adaptive_chat.py
          python tests/test_health_integrity_v019.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Web tests
        working-directory: apps/web
        run: npm test

      - name: Web lint
        working-directory: apps/web
        run: npm run lint

      - name: Web production build
        working-directory: apps/web
        run: npm run build

      - name: Start controlled Ollama endpoint
        shell: bash
        run: |
          cat >/tmp/fake_ollama_v050.py <<'PY'
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer

          class Handler(BaseHTTPRequestHandler):
              def _send(self, payload, status=200):
                  body = json.dumps(payload).encode("utf-8")
                  self.send_response(status)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def do_GET(self):
                  if self.path == "/api/tags":
                      self._send({"models":[{"name":"qwen3.5:4b","model":"qwen3.5:4b"}]})
                      return
                  self._send({"error":"not found"}, 404)

              def do_POST(self):
                  length = int(self.headers.get("Content-Length", "0") or "0")
                  if length:
                      self.rfile.read(length)
                  if self.path == "/api/chat":
                      self._send({"message":{"role":"assistant","content":"SHY v0.50 controlled release-gate response."}})
                      return
                  self._send({"error":"not found"}, 404)

              def log_message(self, format, *args):
                  return

          HTTPServer(("127.0.0.1",11434), Handler).serve_forever()
          PY
          nohup python /tmp/fake_ollama_v050.py >/tmp/fake-ollama-v050.log 2>&1 &

      - name: Start SHY v0.50 API
        shell: bash
        run: |
          cd services/core
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8050 >/tmp/shy-v050.log 2>&1 &
          cd ../..
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8050/health >/tmp/shy-v050-health.json; then
              python - <<'PY'
          import json
          payload=json.load(open("/tmp/shy-v050-health.json","r",encoding="utf-8"))
          assert payload["version"]=="0.50.0", payload
          assert payload["application_healthy"] is True, payload
          assert payload["database_connected"] is True, payload
          assert payload["ollama_connected"] is True, payload
          assert payload["local_model_available"] is True, payload
          print("SHY v0.50 live runtime readiness: PASS")
          PY
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/shy-v050.log
          exit 1

      - name: Verify live integrated platform
        run: |
          python - <<'PY'
          import httpx

          base="http://127.0.0.1:8050"
          platform=httpx.get(base+"/platform/capabilities",timeout=60)
          assert platform.status_code==200, platform.text
          body=platform.json()
          manifest=body["platform"]
          assert manifest["version"]=="0.50.0", manifest
          assert manifest["sequence_complete"] is True, manifest
          assert manifest["required_disabled_invariants_hold"] is True, manifest

          versions={item["introduced_version"] for item in manifest["capabilities"]}
          required={f"0.{version}.0" for version in range(26,51)}
          assert not (required-versions), sorted(required-versions)

          disabled={
              "raw_audio_capture",
              "raw_image_inference",
              "unrestricted_computer_execution",
              "arbitrary_shell_execution",
              "real_person_identity_recognition",
              "autonomous_security_policy_rewrite",
          }
          states={item["capability_id"]:item["state"] for item in manifest["capabilities"]}
          assert all(states.get(item)=="DISABLED" for item in disabled), states

          subsystems=[
              {
                  "capability_id":item["capability_id"],
                  "required":item["state"]!="DISABLED",
                  "available":item["state"]!="DISABLED",
                  "verified":True,
                  "bounded":item["state"] in {"ACTIVE","BOUNDED"},
              }
              for item in manifest["capabilities"]
          ]
          response=httpx.post(
              base+"/advanced/evaluate",
              json={"capability":"integrated_platform","payload":{"subsystems":subsystems}},
              timeout=60,
          )
          assert response.status_code==200, response.text
          result=response.json()["result"]
          assert result["boundary"]=="READY", result
          assert result["payload"]["integrated_ready"] is True, result
          assert result["payload"]["production_deployed"] is False, result
          assert result["payload"]["permission_expanded"] is False, result
          assert result["payload"]["security_policy_rewritten"] is False, result
          assert result["side_effect_performed"] is False, result
          print("SHY v0.50 live integrated platform: PASS")
          PY

      - name: Repository hygiene
        run: |
          git diff --check
          git status --short

      - name: Show logs on failure
        if: failure()
        run: |
          cat /tmp/shy-v050.log || true
          cat /tmp/fake-ollama-v050.log || true
