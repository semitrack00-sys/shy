name: SHY v0.20 Release Gate

on:
  push:
    branches:
      - codex/shy-v0.20-expert-intelligence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shy
          POSTGRES_USER: shy
          POSTGRES_PASSWORD: shy_local_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shy -d shy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://shy:shy_local_dev@127.0.0.1:5432/shy
      SHY_LOCAL_MODEL: qwen3.5:4b
      OLLAMA_URL: http://127.0.0.1:11434
      SHY_API_BASE_URL: http://127.0.0.1:8020
      SHY_WEB_BASE_URL: http://127.0.0.1:3000
      SHY_BACKEND_BASE_URL: http://127.0.0.1:8020
      SHY_EXPECTED_VERSION: 0.20.0
      SHY_ENABLE_KNOWLEDGE_TEST_HOOKS: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: |
          python -m pip install -r services/core/requirements.txt
          python -m pip install pytest

      - name: Compile release candidate
        run: |
          python -m py_compile \
            services/agent-runtime/expert_intelligence.py \
            services/core/main.py \
            services/core/knowledge.py \
            services/core/memory.py \
            tests/test_expert_intelligence_v020.py \
            tests/test_expert_intelligence_live_v020.py \
            tests/test_expert_web_path_live_v020.py \
            tests/test_universal_knowledge_live_v019.py \
            tests/test_user_basics_live_v019.py \
            tests/test_user_reasoning_live_v019.py \
            tests/test_web_user_path_live_v019.py

      - name: Run durable knowledge persistence regression
        run: python -m pytest tests/test_durable_knowledge_persistence_v019.py -q

      - name: Run full protected Python regressions
        shell: bash
        run: |
          set -e
          python tests/test_expert_intelligence_v020.py
          python tests/test_universal_knowledge_v019.py
          python tests/test_business_agent_v017.py
          python tests/test_cognitive_intelligence_v018.py
          python tests/test_multistep_agent.py
          python tests/test_tool_intelligence.py
          python tests/test_multi_model_brain.py
          python tests/test_advanced_memory.py
          python tests/test_memory_relevance.py
          python tests/test_research_synthesis.py
          python tests/test_adaptive_chat.py
          python tests/test_health_integrity_v019.py

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run web unit tests
        working-directory: apps/web
        run: npm test

      - name: Lint web
        working-directory: apps/web
        run: npm run lint

      - name: Build web
        working-directory: apps/web
        run: npm run build

      - name: Start controlled Ollama endpoint
        shell: bash
        run: |
          cat >/tmp/fake_ollama_v020_release.py <<'PY'
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer

          class Handler(BaseHTTPRequestHandler):
              def _send(self, payload, status=200):
                  body = json.dumps(payload).encode("utf-8")
                  self.send_response(status)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def do_GET(self):
                  if self.path == "/api/tags":
                      self._send({
                          "models": [
                              {"name": "qwen3.5:4b", "model": "qwen3.5:4b"}
                          ]
                      })
                      return
                  self._send({"error": "not found"}, 404)

              def do_POST(self):
                  if self.path == "/api/chat":
                      length = int(self.headers.get("Content-Length", "0") or "0")
                      raw = self.rfile.read(length) if length else b"{}"
                      try:
                          request = json.loads(raw.decode("utf-8"))
                      except Exception:
                          request = {}
                      messages = request.get("messages", []) if isinstance(request, dict) else []
                      system_content = ""
                      if messages and isinstance(messages[0], dict):
                          system_content = str(messages[0].get("content", ""))
                      with open("/tmp/shy-v020-release-systems.log", "a", encoding="utf-8") as handle:
                          handle.write(system_content.replace("\n", " ") + "\n")
                      self._send({
                          "message": {
                              "role": "assistant",
                              "content": "SHY v0.20 controlled release-gate model response."
                          }
                      })
                      return
                  self._send({"error": "not found"}, 404)

              def log_message(self, format, *args):
                  return

          HTTPServer(("127.0.0.1", 11434), Handler).serve_forever()
          PY
          nohup python /tmp/fake_ollama_v020_release.py >/tmp/fake-ollama-v020-release.log 2>&1 &
          echo $! >/tmp/fake-ollama-v020-release.pid

      - name: Start SHY v0.20 API
        shell: bash
        run: |
          set -e
          cd services/core
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8020 >/tmp/shy-v020-release-api.log 2>&1 &
          echo $! >/tmp/shy-v020-release-api.pid
          cd ../..
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8020/health >/tmp/shy-v020-release-health.json; then
              cat /tmp/shy-v020-release-health.json
              python - <<'PY'
          import json
          payload = json.load(open("/tmp/shy-v020-release-health.json", "r", encoding="utf-8"))
          assert payload["version"] == "0.20.0"
          assert payload["application_healthy"] is True
          assert payload["ollama_connected"] is True
          assert payload["database_connected"] is True
          assert payload["local_model_available"] is True
          assert payload["knowledge_store"]["type"] == "PostgresKnowledgeStore"
          assert payload["knowledge_store"]["durable"] is True
          assert payload["knowledge_store"]["database_backend"] == "postgresql"
          assert payload["model_routing"]["selection_failures"] == 0
          assert payload["model_routing"]["execution_failures"] == 0
          print("SHY v0.20 release runtime health: PASS")
          PY
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/shy-v020-release-api.log
          exit 1

      - name: Run live backend release gates
        run: |
          python tests/test_universal_knowledge_live_v019.py
          python tests/test_user_basics_live_v019.py
          python tests/test_user_reasoning_live_v019.py
          python tests/test_expert_intelligence_live_v020.py

      - name: Prove expert playbook reached model
        run: |
          grep -F "EXPERT PLAYBOOK: SOFTWARE_ENGINEERING (software-engineering-v1)" /tmp/shy-v020-release-systems.log
          echo "SHY v0.20 live software playbook delivery: PASS"

      - name: Prove durable knowledge across real API restart
        shell: bash
        run: |
          set -e
          python - <<'PY'
          import httpx

          base = "http://127.0.0.1:8020"
          payload = {
              "workspace_id": "v020-release-restart-ws",
              "business_id": "v020-release-restart-biz",
              "user_id": "v020-release-restart-user",
              "source_type": "DOCUMENT",
              "source_id": "v020-release-restart-proof",
              "source_title": "v0.20 release restart proof",
              "subject": "release.v020.restart",
              "content": "SHY v0.20 expert intelligence keeps durable knowledge across an API process restart.",
              "authority": "AUTHORITATIVE",
              "confidence": 0.99,
          }
          response = httpx.post(base + "/testing/knowledge/ingest", json=payload, timeout=30)
          response.raise_for_status()
          body = response.json()
          assert body["accepted"] is True
          created = body.get("created") or []
          assert created
          knowledge_id = created[0]["knowledge_id"]
          open("/tmp/v020-release-knowledge-id.txt", "w", encoding="utf-8").write(knowledge_id)
          print("v0.20 pre-restart knowledge ingest: PASS", knowledge_id)
          PY

          old_pid="$(cat /tmp/shy-v020-release-api.pid)"
          kill "$old_pid"
          for i in $(seq 1 50); do
            if ! kill -0 "$old_pid" 2>/dev/null; then
              break
            fi
            sleep 0.2
          done
          if kill -0 "$old_pid" 2>/dev/null; then
            echo "Old v0.20 API process did not stop cleanly"
            exit 1
          fi

          cd services/core
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8020 >/tmp/shy-v020-release-api-restart.log 2>&1 &
          new_pid=$!
          echo "$new_pid" >/tmp/shy-v020-release-api.pid
          cd ../..

          ready=0
          for i in $(seq 1 60); do
            if ! kill -0 "$new_pid" 2>/dev/null; then
              echo "Restarted v0.20 API exited before readiness"
              cat /tmp/shy-v020-release-api-restart.log
              exit 1
            fi
            if curl -fsS http://127.0.0.1:8020/health >/tmp/shy-v020-restart-health.json; then
              python - <<'PY'
          import json
          payload = json.load(open("/tmp/shy-v020-restart-health.json", "r", encoding="utf-8"))
          assert payload["version"] == "0.20.0"
          assert payload["application_healthy"] is True
          print("v0.20 restarted API readiness: PASS")
          PY
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            echo "Restarted v0.20 API did not become ready"
            cat /tmp/shy-v020-release-api-restart.log
            exit 1
          fi

          python - <<'PY'
          import httpx

          base = "http://127.0.0.1:8020"
          expected_id = open("/tmp/v020-release-knowledge-id.txt", "r", encoding="utf-8").read().strip()
          payload = {
              "workspace_id": "v020-release-restart-ws",
              "business_id": "v020-release-restart-biz",
              "user_id": "v020-release-restart-user",
              "query_text": "What does the v0.20 release restart proof say?",
          }
          response = httpx.post(base + "/testing/knowledge/retrieve", json=payload, timeout=30)
          response.raise_for_status()
          body = response.json()
          ids = {row["knowledge_id"] for row in body.get("records", [])}
          assert expected_id in ids, (expected_id, ids, body)
          assert body.get("citation_integrity") is True
          print("SHY v0.20 real API restart persistence: PASS", expected_id)
          PY

      - name: Start SHY web
        working-directory: apps/web
        shell: bash
        run: |
          nohup npm start -- -p 3000 >/tmp/shy-v020-release-web.log 2>&1 &
          echo $! >/tmp/shy-v020-release-web.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/shy/health >/tmp/shy-v020-web-health.json; then
              cat /tmp/shy-v020-web-health.json
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/shy-v020-release-web.log
          exit 1

      - name: Run exact browser release paths
        run: |
          python tests/test_web_user_path_live_v019.py
          python tests/test_expert_web_path_live_v020.py

      - name: Verify final runtime diagnostics
        run: |
          python - <<'PY'
          import httpx
          payload = httpx.get("http://127.0.0.1:8020/health", timeout=30).json()
          assert payload["version"] == "0.20.0"
          assert payload["application_healthy"] is True
          assert payload["model_routing"]["selection_failures"] == 0, payload["model_routing"]
          assert payload["model_routing"]["execution_failures"] == 0, payload["model_routing"]
          assert payload["model_routing"]["degraded"] is False, payload["model_routing"]
          assert payload["durable_memory"]["degraded"] is False, payload["durable_memory"]
          print("SHY v0.20 final health/routing diagnostics: PASS")
          PY

      - name: Repository hygiene
        run: |
          git diff --check
          git status --short

      - name: Show logs on failure
        if: failure()
        run: |
          cat /tmp/shy-v020-release-api.log || true
          cat /tmp/shy-v020-release-api-restart.log || true
          cat /tmp/shy-v020-release-web.log || true
          cat /tmp/fake-ollama-v020-release.log || true
