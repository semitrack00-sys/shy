name: SHY v0.20 Expert Checkpoint 1

on:
  push:
    branches:
      - codex/shy-v0.20-expert-intelligence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expert-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shy
          POSTGRES_USER: shy
          POSTGRES_PASSWORD: shy_local_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shy -d shy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://shy:shy_local_dev@127.0.0.1:5432/shy
      SHY_LOCAL_MODEL: qwen3.5:4b
      OLLAMA_URL: http://127.0.0.1:11434
      SHY_API_BASE_URL: http://127.0.0.1:8020
      SHY_ENABLE_KNOWLEDGE_TEST_HOOKS: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install core dependencies
        run: python -m pip install -r services/core/requirements.txt

      - name: Compile v0.20 changes
        run: |
          python -m py_compile \
            services/agent-runtime/expert_intelligence.py \
            services/core/main.py \
            tests/test_expert_intelligence_v020.py \
            tests/test_expert_intelligence_live_v020.py

      - name: Run expert intelligence checkpoint
        run: python tests/test_expert_intelligence_v020.py

      - name: Run protected regressions
        shell: bash
        run: |
          set -e
          python tests/test_cognitive_intelligence_v018.py
          python tests/test_universal_knowledge_v019.py
          python tests/test_business_agent_v017.py
          python tests/test_multistep_agent.py
          python tests/test_tool_intelligence.py
          python tests/test_multi_model_brain.py
          python tests/test_advanced_memory.py
          python tests/test_memory_relevance.py
          python tests/test_research_synthesis.py
          python tests/test_adaptive_chat.py
          python tests/test_health_integrity_v019.py

      - name: Start controlled Ollama endpoint
        shell: bash
        run: |
          cat >/tmp/fake_ollama_v020.py <<'PY'
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer

          class Handler(BaseHTTPRequestHandler):
              def _send(self, payload, status=200):
                  body = json.dumps(payload).encode("utf-8")
                  self.send_response(status)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def do_GET(self):
                  if self.path == "/api/tags":
                      self._send({
                          "models": [
                              {"name": "qwen3.5:4b", "model": "qwen3.5:4b"}
                          ]
                      })
                      return
                  self._send({"error": "not found"}, 404)

              def do_POST(self):
                  if self.path == "/api/chat":
                      length = int(self.headers.get("Content-Length", "0") or "0")
                      raw = self.rfile.read(length) if length else b"{}"
                      try:
                          request = json.loads(raw.decode("utf-8"))
                      except Exception:
                          request = {}
                      messages = request.get("messages", []) if isinstance(request, dict) else []
                      system_content = ""
                      if messages and isinstance(messages[0], dict):
                          system_content = str(messages[0].get("content", ""))
                      with open("/tmp/fake-ollama-v020-systems.log", "a", encoding="utf-8") as handle:
                          handle.write(system_content.replace("\n", " ") + "\n")
                      self._send({
                          "message": {
                              "role": "assistant",
                              "content": "SHY v0.20 controlled expert checkpoint response."
                          }
                      })
                      return
                  self._send({"error": "not found"}, 404)

              def log_message(self, format, *args):
                  return

          HTTPServer(("127.0.0.1", 11434), Handler).serve_forever()
          PY
          nohup python /tmp/fake_ollama_v020.py >/tmp/fake-ollama-v020.log 2>&1 &
          echo $! >/tmp/fake-ollama-v020.pid

      - name: Start SHY v0.20 API
        shell: bash
        run: |
          set -e
          cd services/core
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8020 >/tmp/shy-v020-api.log 2>&1 &
          echo $! >/tmp/shy-v020-api.pid
          cd ../..
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8020/health >/tmp/shy-v020-health.json; then
              cat /tmp/shy-v020-health.json
              python - <<'PY'
          import json
          payload = json.load(open("/tmp/shy-v020-health.json", "r", encoding="utf-8"))
          assert payload["version"] == "0.20.0"
          assert payload["application_healthy"] is True
          assert payload["database_connected"] is True
          assert payload["ollama_connected"] is True
          assert payload["local_model_available"] is True
          print("v0.20 live runtime readiness: PASS")
          PY
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/shy-v020-api.log
          exit 1

      - name: Run live expert intelligence proof
        run: python tests/test_expert_intelligence_live_v020.py

      - name: Prove software playbook reached model
        run: |
          grep -F "EXPERT PLAYBOOK: SOFTWARE_ENGINEERING (software-engineering-v1)" /tmp/fake-ollama-v020-systems.log
          echo "live software playbook prompt injection: PASS"

      - name: Repository hygiene
        run: |
          git diff --check
          git status --short

      - name: Show logs on failure
        if: failure()
        run: |
          cat /tmp/shy-v020-api.log || true
          cat /tmp/fake-ollama-v020.log || true
