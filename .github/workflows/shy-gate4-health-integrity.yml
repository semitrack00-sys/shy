name: SHY Gate 4 Health Integrity

on:
  push:
    branches:
      - codex/shy-v0.19-health-integrity-gate4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shy
          POSTGRES_USER: shy
          POSTGRES_PASSWORD: shy_local_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shy -d shy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://shy:shy_local_dev@127.0.0.1:5432/shy
      SHY_LOCAL_MODEL: qwen3.5:4b
      OLLAMA_URL: http://127.0.0.1:11434
      SHY_API_BASE_URL: http://127.0.0.1:8019

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install core dependencies
        run: python -m pip install -r services/core/requirements.txt

      - name: Compile Gate 4 Python
        run: |
          python -m py_compile \
            services/core/main.py \
            tests/test_health_integrity_v019.py \
            tests/test_user_reasoning_live_v019.py

      - name: Run health integrity regression
        run: python tests/test_health_integrity_v019.py

      - name: Run focused non-live regressions
        shell: bash
        run: |
          set -e
          python tests/test_business_agent_v017.py
          python tests/test_multistep_agent.py
          python tests/test_tool_intelligence.py
          python tests/test_adaptive_chat.py

      - name: Start controlled Ollama tags endpoint
        shell: bash
        run: |
          cat >/tmp/fake_ollama.py <<'PY'
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path == "/api/tags":
                      body = json.dumps({
                          "models": [
                              {"name": "qwen3.5:4b", "model": "qwen3.5:4b"}
                          ]
                      }).encode("utf-8")
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                      return
                  self.send_response(404)
                  self.end_headers()

              def log_message(self, format, *args):
                  return

          HTTPServer(("127.0.0.1", 11434), Handler).serve_forever()
          PY
          nohup python /tmp/fake_ollama.py >/tmp/fake-ollama.log 2>&1 &
          echo $! >/tmp/fake-ollama.pid

      - name: Start SHY v0.19 API
        shell: bash
        run: |
          set -e
          cd services/core
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8019 >/tmp/shy-gate4-api.log 2>&1 &
          echo $! >/tmp/shy-gate4-api.pid
          cd ../..
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8019/health >/tmp/shy-health.json; then
              cat /tmp/shy-health.json
              python - <<'PY'
          import json
          payload = json.load(open("/tmp/shy-health.json", "r", encoding="utf-8"))
          assert payload["version"] == "0.19.0"
          assert payload["ollama_connected"] is True
          assert payload["local_model_available"] is True
          assert payload["database_connected"] is True
          assert payload["application_healthy"] is True
          assert payload["status"] == "ok"
          print("live health truthfulness: PASS")
          PY
              exit 0
            fi
            sleep 1
          done
          cat /tmp/shy-gate4-api.log
          exit 1

      - name: Run live user reasoning regression
        run: python tests/test_user_reasoning_live_v019.py

      - name: Show logs on failure
        if: failure()
        run: |
          cat /tmp/shy-gate4-api.log || true
          cat /tmp/fake-ollama.log || true
