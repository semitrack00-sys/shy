name: SHY v0.21 Decision Checkpoint 1

on:
  push:
    branches:
      - codex/shy-v0.21-learning-decision
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decision-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shy
          POSTGRES_USER: shy
          POSTGRES_PASSWORD: shy_local_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shy -d shy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://shy:shy_local_dev@127.0.0.1:5432/shy
      SHY_LOCAL_MODEL: qwen3.5:4b

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install core dependencies
        run: python -m pip install -r services/core/requirements.txt

      - name: Compile v0.21 changes
        run: |
          python -m py_compile \
            services/agent-runtime/decision_intelligence.py \
            tests/test_decision_intelligence_v021.py \
            tests/test_learning_decision_v021.py

      - name: Run decision intelligence checkpoint
        run: |
          python tests/test_decision_intelligence_v021.py
          python tests/test_learning_decision_v021.py

      - name: Run protected regressions
        shell: bash
        run: |
          set -e
          python tests/test_expert_intelligence_v020.py
          python tests/test_universal_knowledge_v019.py
          python tests/test_business_agent_v017.py
          python tests/test_cognitive_intelligence_v018.py
          python tests/test_multistep_agent.py
          python tests/test_tool_intelligence.py
          python tests/test_multi_model_brain.py
          python tests/test_advanced_memory.py
          python tests/test_memory_relevance.py
          python tests/test_research_synthesis.py
          python tests/test_adaptive_chat.py
          python tests/test_health_integrity_v019.py

      - name: Repository hygiene
        run: |
          git diff --check
          git status --short
