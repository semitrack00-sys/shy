name: SHY v0.100 Release Gate

on:
  push:
    branches: [codex/shy-v0.100-verified-platform]
  pull_request:
    branches: [codex/shy-v0.50-integrated-platform]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shy
          POSTGRES_USER: shy
          POSTGRES_PASSWORD: shy_local_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U shy -d shy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://shy:shy_local_dev@127.0.0.1:5432/shy
      SHY_LOCAL_MODEL: qwen3.5:4b
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r services/core/requirements.txt
      - run: python -m compileall -q services packages tests scripts
      - run: python scripts/validate_release.py --report .validation/v100-python.json
      - run: git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shy-v100-python-validation
          path: .validation/v100-python.json

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
