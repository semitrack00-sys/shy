name: SHY Current Release Gate

on:
  push:
    branches: [codex/shy-v0.100-verified-platform, codex/shy-v0.50-integrated-platform, main]
  pull_request:
    branches: [codex/shy-v0.50-integrated-platform, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shy
          POSTGRES_USER: shy
          POSTGRES_PASSWORD: shy_local_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U shy -d shy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://shy:shy_local_dev@127.0.0.1:5432/shy
      SHY_LOCAL_MODEL: qwen3.5:4b
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r services/core/requirements.txt
      - run: python -m compileall -q services packages tests scripts
      - run: python scripts/validate_release.py --report .validation/v100-python.json
      - name: Build the packaged Windows runtime image
        run: docker build -t shy-core:ci .
      - name: Start the packaged runtime against disposable PostgreSQL
        run: |
          docker run -d --name shy-core-ci --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e OLLAMA_URL=http://127.0.0.1:11434 \
            -e SHY_LOCAL_MODEL="$SHY_LOCAL_MODEL" shy-core:ci
          python scripts/verify_local_release.py --wait-seconds 90
      - name: Container diagnostics
        if: failure()
        run: docker logs --tail 100 shy-core-ci || true
      - name: Remove disposable runtime
        if: always()
        run: docker rm -f shy-core-ci || true
      - run: git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shy-v100-python-validation
          path: .validation/v100-python.json

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - name: Browser voice and history acceptance (fixtures)
        run: node acceptance-artifacts/voice-acceptance.cjs

  local_speech:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r services/core/requirements.txt
      - name: Checkout pinned local speech engine
        uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          ref: 927cfce34f31707e17f2bff35c349632fb9e2c3a
          path: .speech-engine
          persist-credentials: false
      - name: Build CPU speech server
        run: |
          cmake -S .speech-engine -B .speech-engine/build -DGGML_CUDA=OFF -DGGML_NATIVE=OFF
          cmake --build .speech-engine/build --config Release --target whisper-server -j 2
      - name: Download multilingual tiny model for one acoustic smoke case
        working-directory: .speech-engine
        run: bash models/download-ggml-model.sh tiny
      - name: Start speech server and verify real audio
        env:
          SHY_WHISPER_URL: http://127.0.0.1:8178
        run: |
          .speech-engine/build/bin/whisper-server -m .speech-engine/models/ggml-tiny.bin --host 127.0.0.1 --port 8178 -ng -nc > .speech-engine/server.log 2>&1 &
          speech_pid=$!
          trap 'kill "$speech_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8178/ > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then echo "Speech server readiness failed"; exit 1; fi
          python scripts/check_local_speech.py --audio .speech-engine/samples/jfk.wav --language en --expected-substring "ask not"
      - name: Speech diagnostics
        if: failure()
        run: tail -n 80 .speech-engine/server.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shy-local-speech-smoke
          path: .validation/local-speech-smoke.json
