name: SHY Version Sequence Gate
on:
  push:
    branches:
      - 'codex/shy-v0.*'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  version-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_DB: shy, POSTGRES_USER: shy, POSTGRES_PASSWORD: shy_local_dev}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shy -d shy"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://shy:shy_local_dev@127.0.0.1:5432/shy
      SHY_LOCAL_MODEL: qwen3.5:4b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install -r services/core/requirements.txt
      - name: Compile runtime
        run: |
          python -m py_compile services/core/main.py
          find services/agent-runtime -maxdepth 1 -name '*.py' -print0 | xargs -0 -n 20 python -m py_compile
      - name: Run cumulative version contracts
        shell: bash
        run: |
          set -e
          for test_file in $(find tests -maxdepth 1 -type f -name 'test_*_v0*.py' ! -name '*live*' | sort); do
            echo "=== $test_file ==="
            python "$test_file"
          done
      - name: Run core protected regressions
        run: |
          python tests/test_multistep_agent.py
          python tests/test_multi_model_brain.py
          python tests/test_health_integrity_v019.py
      - run: git diff --check
