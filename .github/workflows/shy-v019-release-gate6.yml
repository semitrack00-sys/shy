name: SHY v0.19 Release Gate 6

on:
  push:
    branches:
      - codex/shy-v0.19-release-gate6
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shy
          POSTGRES_USER: shy
          POSTGRES_PASSWORD: shy_local_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shy -d shy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://shy:shy_local_dev@127.0.0.1:5432/shy
      SHY_LOCAL_MODEL: qwen3.5:4b
      OLLAMA_URL: http://127.0.0.1:11434
      SHY_API_BASE_URL: http://127.0.0.1:8019
      SHY_WEB_BASE_URL: http://127.0.0.1:3000
      SHY_BACKEND_BASE_URL: http://127.0.0.1:8019
      SHY_ENABLE_KNOWLEDGE_TEST_HOOKS: '1'
      SHY_ENABLE_MODEL_ROUTING_TEST_HOOKS: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: |
          python -m pip install -r services/core/requirements.txt
          python -m pip install pytest

      - name: Compile release candidate Python
        run: |
          python -m py_compile \
            services/core/main.py \
            services/core/knowledge.py \
            services/core/memory.py \
            services/agent-runtime/business_workflows.py \
            services/agent-runtime/task_engine.py \
            tests/test_durable_knowledge_persistence_v019.py \
            tests/test_universal_knowledge_live_v019.py \
            tests/test_user_basics_live_v019.py \
            tests/test_user_reasoning_live_v019.py \
            tests/test_web_user_path_live_v019.py

      - name: Run durable knowledge regression
        run: python -m pytest tests/test_durable_knowledge_persistence_v019.py -q

      - name: Run non-live release regressions
        shell: bash
        run: |
          set -e
          python tests/test_universal_knowledge_v019.py
          python tests/test_business_agent_v017.py
          python tests/test_cognitive_intelligence_v018.py
          python tests/test_multistep_agent.py
          python tests/test_tool_intelligence.py
          python tests/test_multi_model_brain.py
          python tests/test_advanced_memory.py
          python tests/test_memory_relevance.py
          python tests/test_research_synthesis.py
          python tests/test_adaptive_chat.py
          python tests/test_health_integrity_v019.py

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run web unit tests
        working-directory: apps/web
        run: npm test

      - name: Lint web
        working-directory: apps/web
        run: npm run lint

      - name: Build web
        working-directory: apps/web
        run: npm run build

      - name: Start controlled Ollama test endpoint
        shell: bash
        run: |
          cat >/tmp/fake_ollama.py <<'PY'
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer

          class Handler(BaseHTTPRequestHandler):
              def _send_json(self, payload, status=200):
                  body = json.dumps(payload).encode("utf-8")
                  self.send_response(status)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def do_GET(self):
                  if self.path == "/api/tags":
                      self._send_json({
                          "models": [
                              {"name": "qwen3.5:4b", "model": "qwen3.5:4b"}
                          ]
                      })
                      return
                  self._send_json({"error": "not found"}, 404)

              def do_POST(self):
                  if self.path == "/api/chat":
                      length = int(self.headers.get("Content-Length", "0") or "0")
                      if length:
                          self.rfile.read(length)
                      self._send_json({
                          "message": {
                              "role": "assistant",
                              "content": "SHY deterministic release-gate model response."
                          }
                      })
                      return
                  self._send_json({"error": "not found"}, 404)

              def log_message(self, format, *args):
                  return

          HTTPServer(("127.0.0.1", 11434), Handler).serve_forever()
          PY
          nohup python /tmp/fake_ollama.py >/tmp/fake-ollama.log 2>&1 &
          echo $! >/tmp/fake-ollama.pid

      - name: Start SHY v0.19 API
        shell: bash
        run: |
          set -e
          cd services/core
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8019 >/tmp/shy-release-api.log 2>&1 &
          echo $! >/tmp/shy-release-api.pid
          cd ../..
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8019/health >/tmp/shy-release-health.json; then
              cat /tmp/shy-release-health.json
              python - <<'PY'
          import json
          payload = json.load(open("/tmp/shy-release-health.json", "r", encoding="utf-8"))
          assert payload["version"] == "0.19.0"
          assert payload["application_healthy"] is True
          assert payload["ollama_connected"] is True
          assert payload["database_connected"] is True
          assert payload["local_model_available"] is True
          assert payload["knowledge_store"]["durable"] is True
          assert payload["knowledge_store"]["database_backend"] == "postgresql"
          assert payload["model_routing"]["selection_failures"] == 0
          assert payload["model_routing"]["execution_failures"] == 0
          print("v0.19 release runtime health: PASS")
          PY
              exit 0
            fi
            sleep 1
          done
          cat /tmp/shy-release-api.log
          exit 1

      - name: Run live knowledge and user gates
        run: |
          python tests/test_universal_knowledge_live_v019.py
          python tests/test_user_basics_live_v019.py
          python tests/test_user_reasoning_live_v019.py

      - name: Prove knowledge across real API restart
        shell: bash
        run: |
          set -e
          python - <<'PY'
          import httpx

          base = "http://127.0.0.1:8019"
          scope = {
              "workspace_id": "release-restart-ws",
              "business_id": "release-restart-biz",
              "user_id": "release-restart-user",
          }
          payload = {
              **scope,
              "source_type": "DOCUMENT",
              "source_id": "release-gate6-restart-proof",
              "subject": "release.gate.restart",
              "content": "SHY v0.19 release gate knowledge survives an API process restart.",
              "authority": "AUTHORITATIVE",
              "confidence": 0.99,
          }
          response = httpx.post(base + "/testing/knowledge/ingest", json=payload, timeout=30)
          response.raise_for_status()
          body = response.json()
          assert body["accepted"] is True
          created = body.get("created") or []
          assert created
          knowledge_id = created[0]["knowledge_id"]
          open("/tmp/release-knowledge-id.txt", "w", encoding="utf-8").write(knowledge_id)
          print("release pre-restart knowledge ingest: PASS", knowledge_id)
          PY

          kill "$(cat /tmp/shy-release-api.pid)"

          cd services/core
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8019 >/tmp/shy-release-api-restart.log 2>&1 &
          echo $! >/tmp/shy-release-api.pid
          cd ../..

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8019/health >/dev/null; then
              break
            fi
            sleep 1
          done

          python - <<'PY'
          import httpx

          base = "http://127.0.0.1:8019"
          expected_id = open("/tmp/release-knowledge-id.txt", "r", encoding="utf-8").read().strip()
          scope = {
              "workspace_id": "release-restart-ws",
              "business_id": "release-restart-biz",
              "user_id": "release-restart-user",
              "query_text": "What does the SHY v0.19 release gate knowledge say about restart?",
          }
          response = httpx.post(base + "/testing/knowledge/retrieve", json=scope, timeout=30)
          response.raise_for_status()
          body = response.json()
          ids = {row["knowledge_id"] for row in body.get("records", [])}
          assert expected_id in ids, (expected_id, ids, body)
          assert body.get("citation_integrity") is True
          print("release real API restart persistence: PASS", expected_id)
          PY

      - name: Start SHY web
        working-directory: apps/web
        shell: bash
        run: |
          nohup npm start -- -p 3000 >/tmp/shy-release-web.log 2>&1 &
          echo $! >/tmp/shy-release-web.pid
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/api/shy/health >/tmp/shy-release-web-health.json; then
              cat /tmp/shy-release-web-health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/shy-release-web.log
          exit 1

      - name: Run exact browser user path
        run: python tests/test_web_user_path_live_v019.py

      - name: Verify final health and routing
        run: |
          python - <<'PY'
          import httpx
          payload = httpx.get("http://127.0.0.1:8019/health", timeout=30).json()
          assert payload["application_healthy"] is True
          assert payload["model_routing"]["selection_failures"] == 0, payload["model_routing"]
          assert payload["model_routing"]["execution_failures"] == 0, payload["model_routing"]
          assert payload["model_routing"]["degraded"] is False, payload["model_routing"]
          assert payload["durable_memory"]["degraded"] is False, payload["durable_memory"]
          print("v0.19 final health/routing diagnostics: PASS")
          PY

      - name: Repository hygiene
        run: |
          git diff --check
          git status --short

      - name: Show logs on failure
        if: failure()
        run: |
          cat /tmp/shy-release-api.log || true
          cat /tmp/shy-release-api-restart.log || true
          cat /tmp/shy-release-web.log || true
          cat /tmp/fake-ollama.log || true
