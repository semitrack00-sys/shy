name: SHY Milestone Gate

on:
  push:
    branches:
      - 'codex/shy-v0.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  milestone:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shy
          POSTGRES_USER: shy
          POSTGRES_PASSWORD: shy_local_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shy -d shy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://shy:shy_local_dev@127.0.0.1:5432/shy
      SHY_LOCAL_MODEL: qwen3.5:4b

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install core dependencies
        run: python -m pip install -r services/core/requirements.txt

      - name: Compile SHY runtime
        run: |
          python -m compileall -q services/core services/agent-runtime services/model-router

      - name: Run current milestone contract
        run: python tests/test_current_milestone.py

      - name: Run protected regressions
        run: |
          python tests/test_multistep_agent.py
          python tests/test_multi_model_brain.py
          python tests/test_health_integrity_v019.py

      - name: Repository hygiene
        run: git diff --check
