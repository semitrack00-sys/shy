name: SHY Gate 3 Validation

on:
  push:
    branches:
      - codex/shy-v0.19-user-reasoning-gate3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate3:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Compile changed Python
        run: |
          python -m py_compile \
            services/agent-runtime/business_workflows.py \
            services/core/main.py \
            tests/test_business_agent_v017.py \
            tests/test_user_reasoning_live_v019.py

      - name: Run deterministic business regression
        run: python tests/test_business_agent_v017.py
