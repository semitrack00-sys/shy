name: SHY Gate 3 Regression Sweep

on:
  push:
    branches:
      - codex/shy-v0.19-user-reasoning-gate3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shy
          POSTGRES_USER: shy
          POSTGRES_PASSWORD: shy_local_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shy -d shy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://shy:shy_local_dev@127.0.0.1:5432/shy
      SHY_LOCAL_MODEL: qwen3.5:4b
      SHY_API_BASE_URL: http://127.0.0.1:8019

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install core dependencies
        run: python -m pip install -r services/core/requirements.txt

      - name: Compile changed Python
        run: |
          python -m py_compile \
            services/agent-runtime/business_workflows.py \
            services/core/main.py \
            tests/test_business_agent_v017.py \
            tests/test_user_reasoning_live_v019.py

      - name: Run non-live regressions
        shell: bash
        run: |
          set -e
          python tests/test_business_agent_v017.py
          python tests/test_cognitive_intelligence_v018.py
          python tests/test_multistep_agent.py
          python tests/test_tool_intelligence.py
          python tests/test_multi_model_brain.py
          python tests/test_advanced_memory.py
          python tests/test_memory_relevance.py
          python tests/test_research_synthesis.py
          python tests/test_adaptive_chat.py

      - name: Start SHY v0.19 API
        shell: bash
        run: |
          set -e
          cd services/core
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8019 >/tmp/shy-gate3-api.log 2>&1 &
          echo $! >/tmp/shy-gate3-api.pid
          cd ../..
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8019/health >/tmp/shy-health.json; then
              cat /tmp/shy-health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/shy-gate3-api.log
          exit 1

      - name: Run live user-facing Gate 3
        run: python tests/test_user_reasoning_live_v019.py

      - name: Show API log on failure
        if: failure()
        run: cat /tmp/shy-gate3-api.log || true
