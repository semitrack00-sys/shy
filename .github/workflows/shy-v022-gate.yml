name: SHY v0.22 Voice Computer Gate

on:
  push:
    branches:
      - codex/shy-v0.22-voice-computer
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shy
          POSTGRES_USER: shy
          POSTGRES_PASSWORD: shy_local_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shy -d shy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://shy:shy_local_dev@127.0.0.1:5432/shy
      SHY_LOCAL_MODEL: qwen3.5:4b
      OLLAMA_URL: http://127.0.0.1:11434
      SHY_API_BASE_URL: http://127.0.0.1:8022

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r services/core/requirements.txt
      - name: Compile
        run: |
          python -m py_compile services/core/main.py services/agent-runtime/voice_computer.py tests/test_voice_computer_v022.py tests/test_voice_computer_live_v022.py
      - name: Run v0.22 unit gate
        run: python tests/test_voice_computer_v022.py
      - name: Run protected regressions
        run: |
          python tests/test_learning_decision_v021.py
          python tests/test_expert_intelligence_v020.py
          python tests/test_universal_knowledge_v019.py
          python tests/test_cognitive_intelligence_v018.py
          python tests/test_multistep_agent.py
          python tests/test_tool_intelligence.py
          python tests/test_multi_model_brain.py
          python tests/test_health_integrity_v019.py
      - name: Start controlled Ollama
        shell: bash
        run: |
          cat >/tmp/fake_ollama.py <<'PY'
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class H(BaseHTTPRequestHandler):
              def _send(self,p):
                  b=json.dumps(p).encode(); self.send_response(200); self.send_header("Content-Type","application/json"); self.send_header("Content-Length",str(len(b))); self.end_headers(); self.wfile.write(b)
              def do_GET(self):
                  if self.path=="/api/tags": return self._send({"models":[{"name":"qwen3.5:4b","model":"qwen3.5:4b"}]})
                  self.send_response(404); self.end_headers()
              def do_POST(self):
                  n=int(self.headers.get("Content-Length","0") or "0")
                  if n: self.rfile.read(n)
                  if self.path=="/api/chat": return self._send({"message":{"role":"assistant","content":"controlled"}})
                  self.send_response(404); self.end_headers()
              def log_message(self,*args): return
          HTTPServer(("127.0.0.1",11434),H).serve_forever()
          PY
          nohup python /tmp/fake_ollama.py >/tmp/fake-ollama.log 2>&1 &
      - name: Start SHY v0.22
        shell: bash
        run: |
          cd services/core
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8022 >/tmp/shy-v022.log 2>&1 &
          cd ../..
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8022/health >/tmp/health.json; then
              python - <<'PY'
          import json
          p=json.load(open("/tmp/health.json"))
          assert p["version"]=="0.22.0"
          assert p["application_healthy"] is True
          assert p["interaction_capabilities"]["computer_execution"] is False
          print("v0.22 runtime readiness: PASS")
          PY
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/shy-v022.log
          exit 1
      - name: Run live gate
        run: python tests/test_voice_computer_live_v022.py
      - name: Hygiene
        run: git diff --check
      - name: Logs on failure
        if: failure()
        run: cat /tmp/shy-v022.log || true
